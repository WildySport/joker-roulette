<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gamdom Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!--
      THE ARENA'S OWN GAME.

      Built from this repo (it shares the cast's drawings and the sound kit)
      but its OWN build under its OWN base — vite.arena.config.js, base
      /arena/ — so the folder the portal serves at demo.wildylabs.com/arena
      contains the entire game and owes /mansion/ nothing. The asset links
      here are RELATIVE for exactly that reason: they resolve under /arena/
      deployed and under /mansion/ in dev, where one server carries both
      pages.

      The preloads are the first paint: the backdrop and the two idle poses.
      NO crossorigin here, deliberately — the palace's preloads carry it
      because three's ImageLoader requests anonymously and a preload without
      the matching mode is a different cache key. The arena draws with plain
      <img>, which requests WITHOUT it, so here the attribute would cause the
      exact double-download it prevents over there.
    -->
    <link rel="preload" as="image" type="image/webp" href="./scene/arena_bg.webp" />
    <link rel="preload" as="image" type="image/webp" href="./scene/arena_sign.webp" />
    <link rel="preload" as="image" type="image/webp" href="./scene/pepino_keeper_al.webp" />
    <link rel="preload" as="image" type="image/webp" href="./scene/steve.webp" />
    <script type="module" crossorigin src="/arena/assets/arena-Dl3STPg2.js"></script>
    <link rel="stylesheet" crossorigin href="/arena/assets/arena-CNFvb2CB.css">
  </head>
  <body>
    <!-- Same first-second contract as the palace's index.html: inline, no
         dependencies, the game's name in the browser's first frame. The
         arena has no texture loader to count, so the bar only ever sweeps;
         Arena calls __bootDone the moment it mounts. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(120% 90% at 50% 38%, #2a1108 0%, #160b07 55%, #0d0605 100%);
        font-family: Archivo, "Arial Black", system-ui, sans-serif;
        transition: opacity 420ms ease;
      }
      #boot[data-done] { opacity: 0; pointer-events: none; }
      #bootName {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: clamp(20px, 4.2vw, 38px);
        font-weight: 900;
        letter-spacing: 0.02em;
        text-shadow: 0 2px 0 #3a1f08, 0 0 34px rgba(232, 180, 92, 0.25);
      }
      #bootName i { font-style: normal; color: #2ee98c; }
      #bootName s { text-decoration: none; color: #f6efe2; opacity: 0.85; }
      #bootBar {
        position: relative;
        width: clamp(150px, 26vw, 240px);
        height: 4px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(232, 180, 92, 0.16);
        box-shadow: inset 0 0 0 1px rgba(232, 180, 92, 0.22);
      }
      #bootFill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 34%;
        border-radius: 3px;
        background: linear-gradient(90deg, #b9822f, #e8b45c 55%, #ffd88a);
        animation: bootSweep 1150ms ease-in-out infinite;
      }
      @keyframes bootSweep {
        0% { transform: translateX(-105%); }
        100% { transform: translateX(305%); }
      }
      @media (prefers-reduced-motion: reduce) { #bootFill { animation: none; width: 100%; opacity: 0.5; } }
    </style>
    <div id="boot">
      <div id="bootName"><i>GAMDOM</i><s>ARENA</s></div>
      <div id="bootBar"><div id="bootFill"></div></div>
    </div>
    <script>
      window.__bootProgress = function () {};
      window.__bootDone = function () {
        var b = document.getElementById('boot');
        if (!b || b.dataset.done !== undefined) return;
        b.dataset.done = '';
        setTimeout(function () { b.remove(); }, 460);
      };
      /* Failsafe, same reasoning as the palace's: a splash that never leaves
         is worse than no splash. The arena mounts in well under a second, so
         four is plainly "something broke". */
      setTimeout(function () { window.__bootDone(); }, 4000);
    </script>
    <div id="root"></div>
  </body>
</html>
