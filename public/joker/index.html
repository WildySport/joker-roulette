<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Gamdom Roulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try { if (localStorage.getItem('joker-ui') === 'classic') location.replace('classic'); } catch (e) {}</script>
<link rel="stylesheet" href="style.css?v=30">
</head>
<body data-ui="gamdom">

<main class="page">

  <!-- ══════════ THE GAME ══════════ -->
  <section class="app game-card">

    <header class="gbar">
      <div class="gtitle"><img class="mark" src="assets/gamdom-logo.png" alt=""><b>Gamdom Roulette</b><small>54 cards · provably fair</small></div>
      <div class="gbar-right">
        <div class="wallet-pill"><i class="coin">$</i><span class="balance-value" id="balance">$0.00</span></div>
        <button class="wallet-btn" id="resetBalance" hidden>Reset</button>
        <button id="soundToggle" class="icon-btn sound-btn" title="Sound on/off"></button>
      </div>
    </header>

    <!-- the wheel: a strip of cards under a centre line -->
    <section class="spin-area">
      <div class="spin-head">
        <div class="prev-row">
          <span class="prev-label">Previous</span>
          <div class="prev-cards" id="prevCards"></div>
        </div>
        <div class="status-text" id="statusText">Place your bets</div>
        <div class="spin-spacer"></div>
      </div>
      <div class="strip-window" id="stripWindow">
        <div class="strip" id="strip"></div>
        <div class="strip-fade strip-fade-left"></div>
        <div class="strip-fade strip-fade-right"></div>
        <div class="marker-line"></div>
      </div>
      <div class="progress">
        <div class="progress-track"><div class="progress-fill" id="betProgress"></div></div>
        <span class="progress-pill" id="betPill">—</span>
      </div>
      <div class="fair-bar" id="fairBar" title="Provably fair: card index = EOS block ID (hex) mod 54">ROUND #1 · EOS BLOCK · connecting…</div>
    </section>

    <!-- the bet row, as on the site -->
    <div class="bet-row" id="betRow">
      <div class="amount-pill"><i class="coin">$</i><input type="number" id="betAmount" value="1.00" min="0" step="0.01" inputmode="decimal"></div>
      <button id="clearSimple" class="qbtn clear-btn">Clear</button>
      <button class="qbtn" data-add="10">+$10</button>
      <button class="qbtn" data-add="50">+$50</button>
      <button class="qbtn" data-add="100">+$100</button>
      <button class="qbtn" data-op="half">1/2</button>
      <button class="qbtn x2-btn" data-target="betAmount">x2</button>
      <button class="qbtn" data-op="max">Max</button>
      <button id="drawToggle" class="qbtn draw-btn" title="Draw: press and drag across the board to place your bet amount on every cell you cross"><i></i>Draw</button>
    </div>

    <div class="mode-row">
      <label class="mode-switch"><button class="toggle" id="modeToggle" role="switch" aria-checked="false"><span class="knob"></span></button><span>Simple panel</span></label>
      <div class="repeat-ctl">
        <button class="checkbox" id="repeatCheck" role="checkbox" aria-checked="false"></button>
        <span>Repeat next round</span>
        <span class="repeat-count" id="repeatCount">×5</span>
        <input id="repeatInput" class="repeat-input" type="number" min="1" max="999" hidden>
        <button class="edit-btn" id="repeatEdit" title="Set how many rounds to repeat">✎</button>
      </div>
      <div class="total-block"><span class="bt-label">Total bet</span><span id="simpleTotal">$0.00</span></div>
    </div>

    <!-- ── SIMPLE PANEL: the bet cards ── -->
    <div class="panel" id="simplePanel">
      <div class="bet-grid">

        <div class="bet-cell cell-jokers">
          <div class="bet-label"><span>Jokers</span><span class="sel-note">52x · any 26x</span></div>
          <div class="bet-box">
            <div class="opt-tray">
              <button class="opt joker-opt joker-gold" data-key="joker:gold" title="Gold Joker — pays 52x"><img src="assets/joker-gold.png" alt=""></button>
              <button class="opt joker-opt joker-purple" data-key="joker:purple" title="Purple Joker — pays 52x"><img src="assets/joker-purple.png" alt=""></button>
              <button class="opt any-opt" data-key="joker:both" title="Any joker — pays 26x"><span class="at">Any joker</span></button>
            </div>
            <div class="cell-summary" id="sum-joker"></div>
          </div>
        </div>

        <div class="bet-cell cell-values">
          <div class="bet-label"><span>Values</span><span class="sel-note">13x each</span></div>
          <div class="bet-box">
            <div class="opt-tray">
              <button class="value-btn" id="valueBtn" hidden><span id="valueBtnLabel">Pick</span></button>
              <div class="value-menu" id="valueMenu"></div>
            </div>
            <div class="cell-summary" id="sum-value"></div>
          </div>
        </div>

        <div class="bet-cell cell-suits">
          <div class="bet-label"><span>Suits</span><span class="sel-note">4x each</span></div>
          <div class="bet-box">
            <div class="opt-tray">
              <button class="opt suit-opt black-suit" data-key="suit:spades">&#9824;</button>
              <button class="opt suit-opt red-suit" data-key="suit:diamonds">&#9830;</button>
              <button class="opt suit-opt black-suit" data-key="suit:clubs">&#9827;</button>
              <button class="opt suit-opt red-suit" data-key="suit:hearts">&#9829;</button>
            </div>
            <div class="cell-summary" id="sum-suit"></div>
          </div>
        </div>

        <div class="bet-cell cell-colours">
          <div class="bet-label"><span>Colours</span><span class="sel-note">2x</span></div>
          <div class="bet-box">
            <div class="opt-tray">
              <button class="opt colour-opt colour-red" data-key="colour:red" title="Green — pays 2x"><span>Green</span></button>
              <button class="opt colour-opt colour-black" data-key="colour:black" title="White — pays 2x"><span>White</span></button>
            </div>
            <div class="cell-summary" id="sum-colour"></div>
          </div>
        </div>

      </div>

      <div class="bet-summary">
        <div class="summary-head">
          <h3>Your bets</h3>
          <div class="summary-stats">
            <div class="sum-stat"><span class="bt-label">Total bet</span><span class="summary-total" id="summaryTotal">$0.00</span></div>
            <div class="sum-stat"><span class="bt-label">Max win</span><span class="summary-max" id="summaryMax">$0.00</span></div>
          </div>
        </div>
        <div class="summary-chips" id="summaryChips"><span class="summary-empty">No bets yet</span></div>
      </div>
    </div>

    <!-- ── ADVANCED BOARD ── -->
    <div class="board" id="board" hidden>
      <div class="chip-row">
        <div class="chips" id="chipTray">
          <button class="bchip chip-custom selected" data-chip="custom" data-color="custom"><span class="c-dollar">$</span><input id="customChip" value="1.00" inputmode="decimal"></button>
          <button class="bchip chip-c1" data-chip="1" data-color="c1">$1</button>
          <button class="bchip chip-c2" data-chip="2" data-color="c2">$2</button>
          <button class="bchip chip-c5" data-chip="5" data-color="c5">$5</button>
          <button class="bchip chip-c50" data-chip="50" data-color="c50">$50</button>
          <button class="bchip chip-c100" data-chip="100" data-color="c100">$100</button>
          <button class="bchip chip-c500" data-chip="500" data-color="c500">$500</button>
          <button class="bchip chip-c1k" data-chip="1000" data-color="c1k">$1000</button>
        </div>
        <div class="board-total">
          <span class="bt-label">Total</span>
          <span id="boardTotal">$0.00</span>
          <button id="clearBoard" class="qbtn clear-btn">Clear</button>
        </div>
      </div>
      <div class="board-grid" id="boardGrid"></div>
    </div>

  </section>

</main>

<div id="valueBackdrop" class="value-backdrop" hidden></div>

<button id="forceJoker" class="dev-toggle" title="Demo: force the next spins to land on a joker">FORCE<br>JOKER</button>

<a class="back-link" href="/">&larr; Games</a>
<div id="brandToggle" class="brand-toggle" role="group" aria-label="Theme">
  <button data-brand="gamdom">Gamdom</button>
  <button data-brand="wildylabs">WildyLabs</button>
</div>
<script>
/* shared brand switch — same localStorage key across all demo games */
(function () {
  var KEY = 'wl-brand';
  function get() {
    try { return localStorage.getItem(KEY) === 'wildylabs' ? 'wildylabs' : 'gamdom'; }
    catch (e) { return 'gamdom'; }
  }
  function apply(b) {
    document.documentElement.setAttribute('data-brand', b);
    document.querySelectorAll('#brandToggle button').forEach(function (x) {
      x.classList.toggle('on', x.getAttribute('data-brand') === b);
    });
  }
  apply(get());
  document.querySelectorAll('#brandToggle button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      try { localStorage.setItem(KEY, btn.getAttribute('data-brand')); } catch (e) {}
      apply(btn.getAttribute('data-brand'));
    });
  });
})();
</script>

<div id="uiToggle" class="ui-toggle" role="group" aria-label="Interface">
  <button data-ui="gamdom">New UI</button>
  <button data-ui="classic">Classic UI</button>
</div>
<script>
/* the two interfaces share game.js: this page is one of them; the pill swaps to the other */
(function () {
  var here = document.body.dataset.ui || 'classic';
  document.querySelectorAll('#uiToggle button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.ui === here);
    b.addEventListener('click', function () {
      if (b.dataset.ui === here) return;
      try { localStorage.setItem('joker-ui', b.dataset.ui); } catch (e) {}
      location.href = b.dataset.ui === 'classic' ? 'classic' : './';
    });
  });
})();
</script>
<script src="game.js?v=28"></script>
</body>
</html>
